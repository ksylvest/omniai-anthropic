inherit_gem:
  rubocop-basic: rubocop.yml

plugins:
  - rubocop-rake
  - rubocop-rspec

# Example scripts intentionally define multiple tool classes in a single runnable file.
Style/OneClassPerFile:
  Exclude:
    - "examples/**/*"

RSpec/SpecFilePathFormat:
  CustomTransform:
    OmniAI: omniai

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false
